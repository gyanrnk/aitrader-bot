name: collect-market-data

# Reliable free 24/7 collection WITHOUT any external account or token:
# each run LOOPS internally, collecting every 10 min for ~5 hours. So even GitHub's
# slow/erratic scheduler gives near-continuous data — one run covers 5 hours, and the
# next queued run picks up when it ends (concurrency serializes them). Public repos
# get unlimited Actions minutes, so this is free.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write        # GO-signal alert: collector opens an issue -> GitHub emails the owner

concurrency:
  group: collect
  cancel-in-progress: false     # queue new runs behind the active one (chain them)

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330         # ~5.5h, safely under GitHub's 6h job limit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install numpy pandas
      - name: Collect every 10 min for ~5 hours
        env:
          # collector.py opens a GitHub issue on a GO signal (-> GitHub emails the owner).
          # GITHUB_TOKEN is NOT an automatic env var in Actions — it must be passed in.
          # Without this the alert code returns silently and no issue is ever created.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          END=$(( $(date +%s) + 17400 ))     # loop for 4h50m, then exit cleanly
          while [ "$(date +%s)" -lt "$END" ]; do
            python collector.py || true
            if [ -n "$(git status --porcelain data)" ]; then
              git add data
              git commit -m "data: snapshot $(date -u +%FT%TZ)" || true
              # Push with retry. The OLD version used `git pull --rebase -X ours`, which
              # silently DROPPED snapshot commits ("patch contents already upstream") and
              # then `push || true` hid the fact that origin never advanced — the collector
              # ran for 6 days (2026-07-28 -> 08-03) committing locally and pushing nothing.
              # MERGE (not rebase) never drops a commit as a cherry-pick duplicate; -X ours
              # keeps our data on any conflict; and we surface the outcome instead of
              # swallowing it, so a future break shows up in the run log immediately.
              pushed=0
              for attempt in 1 2 3; do
                if git push -q origin master; then pushed=1; break; fi
                echo "push attempt $attempt rejected; merging origin and retrying"
                git fetch -q origin master
                git merge -X ours -q --no-edit origin/master || true
              done
              if [ "$pushed" = 1 ]; then echo "PUSH OK $(date -u +%FT%TZ)"
              else echo "::warning::PUSH FAILED after 3 attempts $(date -u +%FT%TZ)"; fi
            fi
            sleep 600
          done
